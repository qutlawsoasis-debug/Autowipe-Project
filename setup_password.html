<!doctype html>
<html lang="ru" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUST AUTOWIPE // SET PASSWORD</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --surface: #0e0e10;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.25);
      --text: #ffffff;
      --text-soft: #8e8e93;
      --text-muted: #555558;
      --font-sans: 'Geist', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-display: 'Orbitron', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
    }

    .brand-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
      text-align: center;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-soft);
      text-align: center;
      margin-bottom: 24px;
    }

    .msg {
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .msg.err {
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .field {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-soft);
      text-transform: uppercase;
    }

    .field input {
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      border-radius: 2px;
      width: 100%;
      transition: border-color 0.15s ease;
    }

    .field input:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    button {
      background: #fff;
      color: #000;
      border: 1px solid #fff;
      width: 100%;
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      border-radius: 2px;
      margin-top: 10px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #000;
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body translate="no" class="notranslate">
  <form class="auth-card" method="post" autocomplete="on">
    <div class="brand-title">AUTOWIPE</div>
    <div class="brand-sub">Установка пароля для: <b>{{ username }}</b></div>
    
    {% if error %}
      <div class="msg err">{{ error }}</div>
    {% endif %}
    
    <div class="field">
      <label>Новый пароль</label>
      <input name="password" type="password" autocomplete="new-password" minlength="6" required autofocus>
    </div>
    
    <div class="field">
      <label>Подтвердите пароль</label>
      <input name="password2" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    
    <button type="submit">Сохранить и войти</button>
  </form>
</body>
</html>
